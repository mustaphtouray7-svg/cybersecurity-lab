databases:
  - name: cybersecurity-lab-visitors
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: cybersecurity_lab_visitors
    user: cybersecurity_lab_visitors_user

services:
  - type: web
    name: cybersecurity-lab
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybersecurity-lab-visitors
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: https://cybersecurity-lab-yh2s.onrender.com
      - key: ADMIN_PASSWORD
        sync: false
