<body><main class="dashboard"><header><div><p class="eyebrow">CYBERSECURITY LAB / ADMIN</p><h1>Visitor Analysis</h1></div><a class="secondary" href="/">Training site</a></header><section class="panel"><h2>Create a tracking link</h2><form id="create-link"><label for="destination">Destination URL</label><input id="destination" type="url" placeholder="https://example.com" required><button class="primary" type="submit">Create tracking link</button></form><p id="new-link" aria-live="polite"></p></section><section class="panel"><div class="section-head"><h2>Recent visits</h2><button class="secondary" id="refresh" type="button">Refresh</button></div><p class="muted">Emails appear only when visitors choose Google sign-in and approve sharing. Visits without email are shown as anonymous.</p><div class="table-wrap"><table><thead><tr><th>Date</th><th>Email shared</th><th>Destination</th><th>Browser / device</th></tr></thead><tbody id="visitors"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></section><p id="status" class="fine" aria-live="polite"></p></main><script type="module" src="/visitor-admin.js"></script></body></html>
